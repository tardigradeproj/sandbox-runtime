state   = "/var/sandbox-runtime"
version = "0.1.0"

[rootfs]
dir = "/var/lib/sandbox-runtime/rootfs"

[rootfs.packer]
type = "ext4"

[grpc]
listen_address = "unix:///var/run/sandbox-runtime.sock"

[logs]
level  = "info"
format = "text"

[runtime.firecracker]
bin                = "/usr/local/bin/firecracker"
kernel_image_path  = "/var/lib/sandbox-runtime/vmlinux"
default_boot_args  = "console=ttyS0 reboot=k panic=1 pci=off init=/init"

[runtime.firecracker.log]
level           = "Info"
show_level      = true
show_log_origin = false

[runtime.firecracker.jailer]
# Disabled here: this dev/test container doesn't install a jailer
# binary (see .local/Dockerfile). Flip on and set bin_path once it
# does.
enabled         = true
bin_path        = "/usr/local/bin/jailer"
chroot_base_dir = "/var/sandbox-runtime/jailer"

[runtime.firecracker.jailer.uid_gid]
# "on_demand" allocates a fresh uid/gid per sandbox from the range
# below instead of reusing one fixed pair -- the advisable setup in
# production. Switch to mode = "precreated" with static_uid/static_gid
# to reuse one fixed pair instead.
mode        = "on_demand"
range_start = 100000
range_end   = 100999

[network]
# This node's assigned range -- see net-design.md. Single-node dev
# setup, so any private range not already in use works.
cidr        = "10.200.5.0/24"
bridge_name = "sri0"

[network.guest_network]
tap_ip     = "169.254.100.1"
guest_ip   = "169.254.100.2"
prefix_len = 30
