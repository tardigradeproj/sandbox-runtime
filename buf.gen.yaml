version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: .
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: .
    opt: paths=source_relative
  - local: ui/frontend/node_modules/.bin/protoc-gen-es
    out: ui/frontend/src/gen
    opt: target=ts
