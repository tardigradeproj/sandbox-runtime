syntax = "proto3";
package runtime.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/tardigradeproj/sandbox-runtime/pkg/api/runtime/v1;v1";

// RuntimeService defines the public APIs for managing sandbox lifecycle. It
// is the SRI analog of CRI's RuntimeService, pared down to the basics.
service RuntimeService {
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse) {}
  rpc StartSandbox(StartSandboxRequest) returns (StartSandboxResponse) {}

  // ListSandbox lists the sandboxes known to the runtime, optionally
  // narrowed by filter.
  rpc ListSandbox(ListSandboxRequest) returns (ListSandboxResponse) {}

  // UpdateSandboxUserData replaces a running sandbox's user data,
  // delivered to the guest over the same sandbox metadata endpoint
  // SandboxConfig.user_data used at creation.
  rpc UpdateSandboxUserData(UpdateSandboxUserDataRequest) returns (UpdateSandboxUserDataResponse) {}

  // StopSandbox pauses a running sandbox's vCPUs. The process keeps
  // running and its memory/CPU allocation is not released. Idempotent:
  // stopping an already-stopped sandbox succeeds. See ResumeSandbox to
  // undo it.
  rpc StopSandbox(StopSandboxRequest) returns (StopSandboxResponse) {}

  // RemoveSandbox asks a running sandbox's guest to shut down
  // gracefully, then releases what CreateSandbox allocated for it,
  // except its network namespace/tap device -- see DetachNetwork for
  // that. See RemoveSandboxRequest.force for what happens if the
  // guest doesn't shut down on its own in time.
  rpc RemoveSandbox(RemoveSandboxRequest) returns (RemoveSandboxResponse) {}

  // CheckpointSandbox captures a stopped sandbox's VM state to disk,
  // so CreateSandbox can later resume a new sandbox from it. Requires
  // the sandbox to already be stopped; fails if it's still running.
  rpc CheckpointSandbox(CheckpointSandboxRequest) returns (CheckpointSandboxResponse) {}

  // ListCheckpoint lists the checkpoints known to the runtime,
  // optionally narrowed by filter.
  rpc ListCheckpoint(ListCheckpointRequest) returns (ListCheckpointResponse) {}
}

// RootFSService defines the public APIs for managing sandbox root
// filesystems. It is the SRI analog of CRI's ImageService.
service RootFSService {
  // ListRootFS lists the rootfs images known to the runtime, optionally
  // narrowed by filter.
  rpc ListRootFS(ListRootFSRequest) returns (ListRootFSResponse) {}

  // RootFSStatus returns the status of the rootfs identified by spec, if it
  // exists locally.
  rpc RootFSStatus(RootFSStatusRequest) returns (RootFSStatusResponse) {}

  // PullRootFS fetches a rootfs (e.g. from an OCI registry or a template
  // catalog) and stores it locally so it can be used to launch a sandbox.
  rpc PullRootFS(PullRootFSRequest) returns (PullRootFSResponse) {}

  // RemoveRootFS removes a rootfs from local storage.
  rpc RemoveRootFS(RemoveRootFSRequest) returns (RemoveRootFSResponse) {}
}

// NetworkService defines the public APIs for attaching and detaching a
// sandbox's network. It is independent of RuntimeService/RootFSService: it
// deals only in sandbox IDs and generic network handles, with no knowledge
// of how a sandbox is actually run.
service NetworkService {
  // AttachNetwork provisions networking for a sandbox (namespace, tap
  // device, IP) and returns the handles needed to actually run it.
  // Idempotent: calling it again for an already-attached sandbox returns
  // the existing handle rather than erroring.
  rpc AttachNetwork(AttachNetworkRequest) returns (AttachNetworkResponse) {}

  // DetachNetwork tears down a sandbox's networking and releases its IP
  // back to the pool.
  rpc DetachNetwork(DetachNetworkRequest) returns (DetachNetworkResponse) {}
}

message AttachNetworkRequest {
  string sandbox_id = 1;
}

message AttachNetworkResponse {
  // NetnsPath is the network namespace to run the sandbox in.
  string netns_path = 1;

  // TapDevice is the tap device created inside that namespace for the
  // guest's NIC.
  string tap_device = 2;

  // IpAddress is the address assigned to the sandbox, in CIDR form (e.g.
  // "10.200.5.14/24").
  string ip_address = 3;

  // GatewayIp is the address the sandbox should route through.
  string gateway_ip = 4;
}

message DetachNetworkRequest {
  string sandbox_id = 1;
}

message DetachNetworkResponse {}

// RootFSSpec identifies a rootfs the caller wants to resolve, pull, or
// remove.
message RootFSSpec {
  // Reference to the rootfs, e.g. "docker.io/library/alpine:3.19",
  // a content digest, or a runtime-specific template name/URI.
  string image = 1;

  // Annotations carried through from the sandbox request, for runtimes that
  // key rootfs resolution on more than just the reference.
  map<string, string> annotations = 2;
}

// RootFS is a rootfs known to the runtime.
message RootFS {
  // ID is the identifier assigned by the runtime, e.g. a content digest.
  string id = 1;

  // RepoTags are the reference names (tags/URIs) that resolve to this
  // rootfs.
  repeated string repo_tags = 2;

  // RepoDigests are the content digests associated with this rootfs.
  repeated string repo_digests = 3;

  // Size is the size of the rootfs on disk, in bytes.
  uint64 size = 4;

  // Spec is the spec that was used to pull this rootfs, if known.
  RootFSSpec spec = 5;
}

// RootFSFilter narrows a ListRootFS call.
message RootFSFilter {
  RootFSSpec spec = 1;
}

message ListRootFSRequest {
  RootFSFilter filter = 1;
}

message ListRootFSResponse {
  repeated RootFS rootfs = 1;
}

message RootFSStatusRequest {
  RootFSSpec spec = 1;

  // Verbose, when true, asks the runtime to populate info with extra,
  // runtime-specific status.
  bool verbose = 2;
}

message RootFSStatusResponse {
  RootFS rootfs = 1;

  // Info holds extra, runtime-specific info. Only populated when the
  // request set verbose = true.
  map<string, string> info = 2;
}

message PullRootFSRequest {
  RootFSSpec spec = 1;
}

message PullRootFSResponse {
  // RootFSRef is the reference by which the pulled rootfs can be identified
  // in later calls.
  string rootfs_ref = 1;
}

message RemoveRootFSRequest {
  RootFSSpec spec = 1;
}

message RemoveRootFSResponse {}

// SandboxMetadata identifies a sandbox for the purposes of logging and
// debugging.
message SandboxMetadata {
  // Name is a human-readable identifier for the sandbox. It need not be
  // unique.
  string name = 1;

  // Uid is a unique, caller-assigned identifier for the sandbox.
  string uid = 2;

  map<string, string> labels = 3;
}

// SandboxResources describes the resources to reserve for a sandbox.
message SandboxResources {
  // CPU, in fractional cores (e.g. 0.5 is half a core). <= 0 means
  // unconstrained.
  double cpu = 1;

  // MemoryBytes is the memory limit, in bytes. <= 0 means unconstrained.
  int64 memory_bytes = 2;

  int64 storage_bytes = 3;
}

// RootFSMount describes how a rootfs is attached to a sandbox as a
// block device.
message RootFSMount {
  // Spec identifies the rootfs to attach. It must already be present
  // locally (see RootFSService.PullRootFS).
  RootFSSpec spec = 1;

  // IsReadOnly mounts the rootfs read-only.
  bool is_read_only = 2;

  // IsRootDevice marks this as the root block device the guest kernel
  // boots from (i.e. it is referenced by the kernel command line's "root="
  // argument).
  bool is_root_device = 3;

  // Partuuid is the unique partition identifier of the boot partition on
  // this drive. When set, it takes precedence over device-index-based
  // root device lookup.
  string partuuid = 4;
}

// SandboxUserData is caller-supplied data made available to the
// guest at boot via the runtime's own sandbox metadata endpoint.
message SandboxUserData {
  google.protobuf.Struct system = 1;
  string boot = 2;
}

// BootConfig describes how to boot a sandbox's guest kernel.
message BootConfig {
  // KernelImagePath is the path to the uncompressed guest kernel image.
  string kernel_image_path = 1;

  // InitrdPath is the path to the initrd, if any.
  string initrd_path = 2;

  // BootArgs is the kernel command line, e.g.
  // "console=ttyS0 reboot=k panic=1 pci=off".
  string boot_args = 3;
}

// SandboxConfig describes a sandbox to be created.
message SandboxConfig {
  SandboxMetadata metadata = 1;

  oneof boot_source {
    // RootFS describes the root filesystem the sandbox should be launched
    // with and how it is attached.
    RootFSMount rootfs = 2;

    // CheckpointRef resumes the sandbox from a checkpoint instead
    // (see RuntimeService.CheckpointSandbox) -- boot and resources
    // below are ignored, the checkpoint already captured both.
    string checkpoint_ref = 7;
  }

  // Boot describes how to boot the sandbox's guest kernel. Ignored
  // when boot_source is checkpoint_ref.
  BootConfig boot = 3;

  // Resources are the resources to reserve for the sandbox, allocated when
  // the sandbox is run.
  SandboxResources resources = 4;

  SandboxUserData user_data = 8;
}

// UserGroup is the uid/gid a sandbox's microVM process runs as on the
// host.
message UserGroup {
  uint64 uid = 1;
  uint64 gid = 2;
}

// SandboxNetwork describes a sandbox's networking, as last reported
// by AttachNetwork.
message SandboxNetwork {
  string ip_address = 1;
}

// SandboxStateValue is a sandbox's current run state.
enum SandboxStateValue {
  STATE_UNSPECIFIED = 0;
  STATE_RUNNING = 1;
  STATE_STOPPED = 2;
  // STATE_PENDING: the microVM has been created but not started.
  STATE_PENDING = 3;
}

// SandboxTrait is a sandbox's observed state, as reported by
// ListSandbox.
message SandboxTrait {
  SandboxConfig config = 1;
  UserGroup user = 2;
  SandboxNetwork network = 3;
  SandboxStateValue state = 4;
}

// SandboxFilter narrows a ListSandbox call.
message SandboxFilter {
  string uid = 1;
  SandboxStateValue state = 2;
  // label_selector are ANDed
  map<string, string> label_selector = 3;
}

message ListSandboxRequest {
  SandboxFilter filter = 1;
}

message ListSandboxResponse {
  repeated SandboxTrait sandbox = 1;
}

message CreateSandboxRequest {
  SandboxConfig config = 1;
}

message CreateSandboxResponse {
  string sandbox_id = 1;
}

message StartSandboxRequest {
  string sandbox_id = 1;
}

message StartSandboxResponse {}

message UpdateSandboxUserDataRequest {
  string sandbox_id = 1;
  SandboxUserData user_data = 2;
}

message UpdateSandboxUserDataResponse {}

message StopSandboxRequest {
  string sandbox_id = 1;
}

message StopSandboxResponse {}

message RemoveSandboxRequest {
  string sandbox_id = 1;

  // force, if set, kills the sandbox's process with SIGKILL once
  // timeout_seconds elapses without it shutting down on its own. If
  // unset and the sandbox is still running after timeout_seconds,
  // RemoveSandbox fails instead of killing it.
  bool force = 2;

  // timeout_seconds bounds how long RemoveSandbox waits, after asking
  // the guest to shut down gracefully, before deciding it's not going
  // to stop on its own. 0 means don't wait at all. Ignored if the
  // sandbox isn't running.
  int64 timeout_seconds = 3;
}

message RemoveSandboxResponse {}

message CheckpointSandboxRequest {
  string sandbox_id = 1;

  // Uid is this checkpoint's own id, used as its storage key and
  // returned as checkpoint_ref. Defaults to sandbox_id when empty.
  // Fails if a checkpoint with this id already exists.
  string uid = 2;

  // Name is an optional human label. Need not be unique.
  string name = 3;
}

message CheckpointSandboxResponse {
  // CheckpointRef identifies the checkpoint for a later CreateSandbox
  // call -- the same role RootfsRef plays for PullRootFS.
  string checkpoint_ref = 1;
}

// Checkpoint is a sandbox checkpoint known to the runtime, as
// captured by CheckpointSandbox.
message Checkpoint {
  // CheckpointRef identifies this checkpoint for a later CreateSandbox
  // call -- the same ref CheckpointSandboxResponse returned.
  string checkpoint_ref = 1;

  // Name is the optional human label given to CheckpointSandbox.
  string name = 2;

  // Config is the sandbox config this checkpoint was taken from.
  SandboxConfig config = 3;

  // Network is the sandbox's networking at checkpoint time.
  SandboxNetwork network = 4;

  // User is the jailer uid/gid the sandbox ran under.
  UserGroup user = 5;

  // CreatedAt is when the checkpoint was taken.
  google.protobuf.Timestamp created_at = 6;
}

// CheckpointFilter narrows a ListCheckpoint call.
message CheckpointFilter {
  string checkpoint_ref = 1;
}

message ListCheckpointRequest {
  CheckpointFilter filter = 1;
}

message ListCheckpointResponse {
  repeated Checkpoint checkpoint = 1;
}
