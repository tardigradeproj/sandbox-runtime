syntax = "proto3";
package console.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/tardigradeproj/sandbox-runtime/ui/proto/console/v1;consolev1";

// ExecService lets the console run interactive commands (with an
// optional PTY) inside a sandbox. It is a browser-reachable bridge
// over ui/server.exec.go, not a passthrough of RuntimeService: every
// call dials the target sandbox's own sandboxd ProcessService
// directly at its guest IP (see SandboxTrait.network.ip_address),
// mirroring sandboxd's own process.v1.ProcessService one-for-one --
// sri's RuntimeService itself never proxies process execution.
service ExecService {
  // Start runs a command in the sandbox at address and streams its
  // stdout/stderr events until it exits.
  rpc Start(StartRequest) returns (stream StartResponse) {}

  // WriteStdin sends input (or EOF) to a process started by Start.
  rpc WriteStdin(WriteStdinRequest) returns (WriteStdinResponse) {}

  // ResizeTTY resizes a running process's pseudo-terminal.
  rpc ResizeTTY(ResizeTTYRequest) returns (ResizeTTYResponse) {}

  // SendSignal delivers a POSIX signal to a running process.
  rpc SendSignal(SendSignalRequest) returns (SendSignalResponse) {}
}

enum Signal {
  SIGNAL_UNSPECIFIED = 0;
  SIGNAL_SIGINT = 2;
  SIGNAL_SIGKILL = 9;
  SIGNAL_SIGTERM = 15;
}

message PTY {
  uint32 cols = 1;
  uint32 rows = 2;
}

message StartRequest {
  // address is the sandbox's guest IP (SandboxTrait.network.ip_address);
  // sandboxd's ProcessService is dialed at address:9090.
  string address = 1;
  repeated string command = 2;
  map<string, string> env_vars = 3;
  optional string cwd = 4;
  optional PTY pty = 5;
}

message InitEvent {
  int32 process_id = 1;
}

message ExitEvent {
  int32 exit_code = 1;
}

message StartResponse {
  oneof event {
    InitEvent init = 1;
    bytes stdout = 2;
    bytes stderr = 3;
    ExitEvent exit = 4;
  }
}

message WriteStdinRequest {
  string address = 1;
  int32 process_id = 2;
  oneof payload {
    bytes input = 3;
    google.protobuf.Empty eof = 4;
  }
}

message WriteStdinResponse {}

message ResizeTTYRequest {
  string address = 1;
  int32 process_id = 2;
  uint32 cols = 3;
  uint32 rows = 4;
}

message ResizeTTYResponse {}

message SendSignalRequest {
  string address = 1;
  int32 process_id = 2;
  Signal signal = 3;
}

message SendSignalResponse {}
